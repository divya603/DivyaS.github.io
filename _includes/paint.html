{% include base_path %}
<!-- MS Paint drawing overlay: styles in assets/css/paint.css, logic in assets/js/paint.js -->
<canvas id="mspaint-canvas" aria-hidden="true"></canvas>

<div id="mspaint-window" class="mspaint-window" role="region" aria-label="Drawing tools">
  <div class="mspaint-titlebar">
    <svg class="mspaint-titlebar-icon" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#ff0000"/><rect x="7" y="1" width="6" height="6" fill="#ffff00"/><rect x="1" y="7" width="6" height="6" fill="#0000ff"/><rect x="7" y="7" width="6" height="6" fill="#00ff00"/><rect x="0.5" y="0.5" width="13" height="13" fill="none" stroke="#ffffff"/></svg>
    <span class="mspaint-titlebar-text">untitled - Paint</span>
    <span class="mspaint-titlebar-btns">
      <button id="mspaint-minimize" type="button" title="Minimize" aria-label="Minimize">_</button>
      <button id="mspaint-close" type="button" title="Close" aria-label="Close">&times;</button>
    </span>
  </div>

  <div class="mspaint-menubar" aria-hidden="true">
    <span>File</span><span>Edit</span><span>View</span><span>Image</span><span>Colors</span><span>Help</span>
  </div>

  <div class="mspaint-main">
    <div class="mspaint-toolstrip">
      <div class="mspaint-tools" role="toolbar" aria-label="Tools">
        <button class="mspaint-tool" type="button" data-tool="select" title="Select (browse the page)" aria-label="Select">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1v11.4l2.8-2.5 1.8 4.3 1.9-0.8-1.8-4.3 3.7-0.3z" fill="#000000" stroke="#ffffff" stroke-width="0.75"/></svg>
        </button>
        <button class="mspaint-tool" type="button" data-tool="eraser" title="Eraser" aria-label="Eraser">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 9l5-5 5 3-5 5z" fill="#ffb6da" stroke="#000000" stroke-width="0.75"/><path d="M3 9v2.5l5 3v-2.5z" fill="#e587b4" stroke="#000000" stroke-width="0.75"/><path d="M8 12l5-5v2.5l-5 5z" fill="#c96a9e" stroke="#000000" stroke-width="0.75"/></svg>
        </button>
        <button class="mspaint-tool is-active" type="button" data-tool="pencil" title="Pencil" aria-label="Pencil">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14l1.5-4.5L11 2l3 3-7.5 7.5z" fill="#ffd83d" stroke="#000000" stroke-width="0.75"/><path d="M2 14l1.5-4.5 3 3z" fill="#000000"/></svg>
        </button>
        <button class="mspaint-tool" type="button" data-tool="brush" title="Brush" aria-label="Brush">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7" y="0.5" width="3" height="4.5" fill="#ffffff" stroke="#000000" stroke-width="0.75"/><rect x="6.5" y="5" width="4" height="2" fill="#c0c0c0" stroke="#000000" stroke-width="0.75"/><path d="M6 7.5h5v3.5c0 2-1.3 3.5-2.5 3.5S6 13 6 11z" fill="#000000"/></svg>
        </button>
        <button class="mspaint-tool" type="button" data-tool="spray" title="Airbrush" aria-label="Airbrush">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="2" cy="2.2" r="0.9" fill="#000000"/><circle cx="5" cy="1.4" r="0.9" fill="#000000"/><circle cx="3.6" cy="4.4" r="0.9" fill="#000000"/><rect x="7.5" y="3.6" width="3" height="2.4" fill="#000000"/><rect x="6" y="6" width="6" height="9" fill="#c0c0c0" stroke="#000000" stroke-width="0.75"/><rect x="7.4" y="8" width="3.2" height="3" fill="#ffffff" stroke="#000000" stroke-width="0.5"/></svg>
        </button>
        <button class="mspaint-tool" type="button" data-tool="line" title="Line" aria-label="Line">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5L13.5 2.5" stroke="#000000" stroke-width="1.5"/></svg>
        </button>
      </div>
      <div class="mspaint-sizes" role="toolbar" aria-label="Line width">
        <button class="mspaint-size" type="button" data-size="1" title="Thin" aria-label="Thin"></button>
        <button class="mspaint-size is-active" type="button" data-size="2" title="Medium" aria-label="Medium"></button>
        <button class="mspaint-size" type="button" data-size="4" title="Thick" aria-label="Thick"></button>
        <button class="mspaint-size" type="button" data-size="8" title="Extra thick" aria-label="Extra thick"></button>
      </div>
    </div>
    <div class="mspaint-hint">
      <p><strong>Draw anywhere on the page!</strong></p>
      <p>Pick a tool and a color, then click and drag.</p>
      <p class="mspaint-kbd">Esc &mdash; stop drawing<br>Ctrl/&#8984;+Z &mdash; undo</p>
    </div>
  </div>

  <div class="mspaint-actions">
    <button id="mspaint-undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
    <button id="mspaint-clear" type="button" title="Clear all doodles">Clear</button>
  </div>

  <div class="mspaint-palette-row">
    <div class="mspaint-current" title="Current color">
      <span class="mspaint-current-fg"></span>
    </div>
    <div class="mspaint-palette" role="toolbar" aria-label="Colors">
      <button class="mspaint-swatch" type="button" data-color="#000000" style="background:#000000" aria-label="Black"></button>
      <button class="mspaint-swatch" type="button" data-color="#808080" style="background:#808080" aria-label="Gray"></button>
      <button class="mspaint-swatch" type="button" data-color="#800000" style="background:#800000" aria-label="Maroon"></button>
      <button class="mspaint-swatch" type="button" data-color="#808000" style="background:#808000" aria-label="Olive"></button>
      <button class="mspaint-swatch" type="button" data-color="#008000" style="background:#008000" aria-label="Green"></button>
      <button class="mspaint-swatch" type="button" data-color="#008080" style="background:#008080" aria-label="Teal"></button>
      <button class="mspaint-swatch" type="button" data-color="#000080" style="background:#000080" aria-label="Navy"></button>
      <button class="mspaint-swatch" type="button" data-color="#800080" style="background:#800080" aria-label="Purple"></button>
      <button class="mspaint-swatch" type="button" data-color="#808040" style="background:#808040" aria-label="Khaki"></button>
      <button class="mspaint-swatch" type="button" data-color="#004040" style="background:#004040" aria-label="Dark teal"></button>
      <button class="mspaint-swatch" type="button" data-color="#0080ff" style="background:#0080ff" aria-label="Sky blue"></button>
      <button class="mspaint-swatch" type="button" data-color="#004080" style="background:#004080" aria-label="Slate blue"></button>
      <button class="mspaint-swatch" type="button" data-color="#8000ff" style="background:#8000ff" aria-label="Violet"></button>
      <button class="mspaint-swatch" type="button" data-color="#804000" style="background:#804000" aria-label="Brown"></button>
      <button class="mspaint-swatch" type="button" data-color="#ffffff" style="background:#ffffff" aria-label="White"></button>
      <button class="mspaint-swatch" type="button" data-color="#c0c0c0" style="background:#c0c0c0" aria-label="Silver"></button>
      <button class="mspaint-swatch" type="button" data-color="#ff0000" style="background:#ff0000" aria-label="Red"></button>
      <button class="mspaint-swatch" type="button" data-color="#ffff00" style="background:#ffff00" aria-label="Yellow"></button>
      <button class="mspaint-swatch" type="button" data-color="#00ff00" style="background:#00ff00" aria-label="Lime"></button>
      <button class="mspaint-swatch" type="button" data-color="#00ffff" style="background:#00ffff" aria-label="Cyan"></button>
      <button class="mspaint-swatch" type="button" data-color="#0000ff" style="background:#0000ff" aria-label="Blue"></button>
      <button class="mspaint-swatch" type="button" data-color="#ff00ff" style="background:#ff00ff" aria-label="Magenta"></button>
      <button class="mspaint-swatch" type="button" data-color="#ffff80" style="background:#ffff80" aria-label="Pale yellow"></button>
      <button class="mspaint-swatch" type="button" data-color="#00ff80" style="background:#00ff80" aria-label="Spring green"></button>
      <button class="mspaint-swatch" type="button" data-color="#80ffff" style="background:#80ffff" aria-label="Pale cyan"></button>
      <button class="mspaint-swatch" type="button" data-color="#8080ff" style="background:#8080ff" aria-label="Periwinkle"></button>
      <button class="mspaint-swatch" type="button" data-color="#ff0080" style="background:#ff0080" aria-label="Hot pink"></button>
      <button class="mspaint-swatch" type="button" data-color="#ff8040" style="background:#ff8040" aria-label="Orange"></button>
    </div>
  </div>

  <div class="mspaint-status">Pencil: click and drag anywhere on the page to draw.</div>
</div>

<button id="mspaint-taskbar-btn" class="mspaint-taskbar-btn mspaint-hidden" type="button" title="Open Paint">
  <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#ff0000"/><rect x="7" y="1" width="6" height="6" fill="#ffff00"/><rect x="1" y="7" width="6" height="6" fill="#0000ff"/><rect x="7" y="7" width="6" height="6" fill="#00ff00"/><rect x="0.5" y="0.5" width="13" height="13" fill="none" stroke="#000000"/></svg>
  <span>untitled - Paint</span>
</button>

<script src="{{ base_path }}/assets/js/paint.js"></script>
